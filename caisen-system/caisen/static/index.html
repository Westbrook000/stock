<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蔡森量价结构研究台</title><link rel="stylesheet" href="/static/app.css?v=20261025j"></head>
<body><header><div><b>蔡森量价结构</b><small>研究工作台 · 不连接券商</small></div><span id="health">连接中…</span></header>
<main><div id="refreshRecovery" aria-live="polite"></div><nav><button class="active" data-panel="scan">市场扫描</button><button data-panel="detail">形态详情</button><button data-panel="replay">历史回放</button><button data-panel="review">人工复核</button></nav>
<section id="scan" class="panel active"><h1>市场扫描</h1><p>一次扫描本地全部股票和 ETF，并按当前买入条件优先排序。行内显示日/周形态、迷你 K 线和数据告警；结论供你复核，系统不会自动下单。</p><p class="muted">周线只有在交易日历核实完整周后才参与正式判断；否则仅供预览。</p><div class="form"><label>范围<select id="scanKind"><option value="all">股票 + 全部 ETF</option><option value="stock">股票</option><option value="etf">ETF</option></select></label><label>ETF类别<select id="scanCategory"><option value="">全部</option><option value="equity">股票型</option><option value="bond">债券型</option><option value="money">货币型</option><option value="gold">黄金</option><option value="commodity">商品</option><option value="crossborder">跨境</option><option value="unclassified">未分类</option></select></label><label>形态<select id="scanPattern"><option value="">全部 12 招</option></select></label><label>周期<select id="scanTimeframes" multiple><option value="1d" selected>日线</option><option value="1w" selected>周线</option></select></label><label>确认日期起<input id="scanAfter" type="date"></label><label>确认日期止<input id="scanBefore" type="date"></label><label>扫描数量<input id="scanLimit" type="number" min="1" value="10000"></label><button id="scanBtn">全量扫描</button><button id="refreshAllBtn" type="button" class="secondary">更新全部行情</button></div><div id="scanStatus" role="status"></div><div id="refreshAllReport" class="refresh-report-region" aria-live="polite"></div><div id="scanSummary"></div><div id="results"></div></section>
<section id="detail" class="panel"><h1>形态详情</h1><div class="form"><label>代码<input id="code" value="000001"></label><label>品类<select id="kind"><option value="stock">股票</option><option value="etf">ETF</option></select></label><label>周期<select id="tf"><option value="1d">日线</option><option value="1w">周线</option></select></label><label>截至日期<input id="asof" type="date"></label><button id="analyzeBtn">分析</button><button id="refreshOneBtn" type="button" class="secondary">更新当前行情</button></div><div class="chart-toolbar"><label>显示范围<select id="chartRange"><option value="60">近3个月</option><option value="120" selected>近6个月</option><option value="250">近1年</option><option value="500">近2年</option><option value="custom" disabled>自定义缩放</option><option value="all">全部历史</option></select></label><div class="chart-actions"><button type="button" data-chart-action="in" aria-label="放大K线">放大 +</button><button type="button" data-chart-action="out" aria-label="缩小K线">缩小 −</button><button type="button" data-chart-action="all">全部历史</button><button type="button" data-chart-action="latest">回到最新</button></div><span id="chartNote" role="status"></span></div><div id="refreshOneReport" class="refresh-report-region" aria-live="polite"></div><div id="chart"></div><div id="detailRows"></div></section>
<section id="replay" class="panel"><h1>历史回放</h1><p>选择“截至日期”后只读取截止日期以前的 OHLCV，未完成周线不会进入正式周线结构。今日复权快照不代表严格的历史当时数据。</p><button id="replayBtn">按详情条件回放</button><pre id="replayOutput"></pre></section>
<section id="review" class="panel"><h1>人工复核</h1><p>选择一个形态后记录接受、误识别或修正。人工版本与自动结果分开保存。</p><label>形态 ID<input id="reviewId" placeholder="从扫描或详情结果选择"></label><label>结论<select id="verdict"><option value="accepted">接受</option><option value="false_positive">误识别</option><option value="corrected">已修正</option><option value="needs_review">待复核</option></select></label><label>备注<textarea id="note"></textarea></label><button id="saveReview">保存复核</button><pre id="reviewOutput"></pre></section>
</main><script>window.__caisenAmdDefine=window.define;if(window.define&&window.define.amd)window.define=undefined;</script><script src="/static/vendor/echarts.min.js?v=20261025"></script><script>if(window.__caisenAmdDefine)window.define=window.__caisenAmdDefine;delete window.__caisenAmdDefine;</script><script src="/static/refresh_report.js?v=20261025v16"></script><script src="/static/app.js?v=20261025v16"></script></body></html>
